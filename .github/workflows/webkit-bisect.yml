# Temporary: repeats the WebKit internal-links test on main and on this
# branch to show which one hangs. Removed before merge.
name: WebKit bisect
on: pull_request
permissions:
  contents: read
jobs:
  repeat:
    name: Internal links x8 on ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [main, head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=mobile-webkit tests/e2e/site.spec.ts -g "internal navigation" --repeat-each=8 --retries=0 --timeout=60000 --reporter=line
