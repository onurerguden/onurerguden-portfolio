name: IndexNow
# Vercel reports each deployment to GitHub; once production is live, a smoke
# test checks what crawlers see, then the pages this deploy changed are
# submitted to the IndexNow search engines.
on: deployment_status
permissions:
  contents: read
  deployments: read
jobs:
  submit:
    name: Check SEO and submit the sitemap to IndexNow
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous deploy's editorial dates are read from its commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/seo-smoke.mjs
      - name: Find the previous production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT: ${{ github.event.deployment.id }}
        # Newest first; a later deploy marks earlier ones inactive, so look for
        # any success rather than the latest state. None found: every page.
        run: |
          for id in $(gh api "repos/$REPOSITORY/deployments?environment=Production&per_page=30" --jq ".[] | select(.id != $CURRENT) | .id"); do
            if [ "$(gh api "repos/$REPOSITORY/deployments/$id/statuses?per_page=100" --jq 'any(.[]; .state == "success")')" = "true" ]; then
              echo "INDEXNOW_PREVIOUS_SHA=$(gh api "repos/$REPOSITORY/deployments/$id" --jq .sha)" >> "$GITHUB_ENV"
              break
            fi
          done
      - run: node scripts/indexnow.mjs
