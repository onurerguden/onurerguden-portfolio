# Weekly dependency updates, grouped so each week is one reviewable pull
# request per ecosystem. Security updates are opened as soon as they exist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # three is still 0.x: every minor release may break the API (r187
      # rewrote PMREMGenerator, which src/components/desk/studio.ts relies
      # on) and needs a new Draco decoder folder. It gets a pull request of
      # its own, with its types, so it never holds back the weekly group.
      # Groups match in order, so this one comes first.
      three:
        patterns: ["three", "@types/three"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major in package.json engines and CI, so they
      # never describe APIs the runtime lacks. Raise both together.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Blocked upstream: eslint-plugin-react, -import and -jsx-a11y (via
      # eslint-config-next) do not run on ESLint 10, and typescript-eslint
      # refuses TypeScript 7. Revisit when eslint-config-next supports them.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
